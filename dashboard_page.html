<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Expense Dashboard</title>
</head>
<body>
  <h1>Expense Dashboard (Minimal)</h1>
  <div id="accounts"></div>
  <script>
    async function load() {
      const res = await fetch('/api/accounts/');
      const accounts = await res.json();
      const container = document.getElementById('accounts');
      if (accounts.length === 0) {
        container.innerHTML = '<p>No accounts yet. Create one via POST /api/accounts/</p>';
        return;
      }
      container.innerHTML = accounts.map(a => `
        <div style="border:1px solid #ccc;padding:8px;margin:8px;">
          <h2>${a.name} — ${a.currency}</h2>
          <p>Total: ${a.total_balance}</p>
          <p>Spendable: ${a.allocations.find(x=>x.type==='spendable')?.balance || '0.00'}</p>
          <p>Savings: ${a.allocations.find(x=>x.type==='savings')?.balance || '0.00'}</p>
        </div>
      `).join('');
    }
    load();
  </script>
</body>
</html>
