<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — PG Expense</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f5f7fa; color: #172033; }
        main { width: min(420px, calc(100% - 32px)); padding: 28px; border: 1px solid #d9dee8; border-radius: 16px; background: white; box-sizing: border-box; }
        h1 { margin: 0 0 8px; font-size: 1.5rem; }
        p { color: #5d687a; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #c8cfdb; border-radius: 8px; font: inherit; }
        button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
        .error { color: #b42318; }
    </style>
</head>
<body>
<main>
    <h1>PG Expense</h1>
    <p>Sign in to access your financial workspace.</p>
    {% if form.errors %}<p class="error">Invalid username or password. Please try again.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="id_username">Username</label>
        <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="id_password">Password</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
